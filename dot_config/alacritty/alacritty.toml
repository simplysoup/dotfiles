# ~/.config/alacritty/alacritty.toml
env = { TERM = "xterm-256color" }

[window]
decorations = "full"  # "none" for borderless
opacity = 0.95
dynamic_title = true
startup_mode = "Maximized"  # Alternatives: "Windowed", "Fullscreen"

[window.padding]
x = 5
y = 5

[scrolling]
history = 10000
multiplier = 3

[font]
size = 12.0

[font.normal]
family = "Fira Code"
style = "Regular"

[font.bold]
family = "Fira Code"
style = "Bold"

[font.italic]
family = "Fira Code"
style = "Italic"

[colors]
primary = { background = "#282828", foreground = "#ebdbb2" }
cursor = { text = "#282828", cursor = "#ebdbb2" }

[colors.normal]
black = "#282828"
red = "#cc241d"
green = "#98971a"
yellow = "#d79921"
blue = "#458588"
magenta = "#b16286"
cyan = "#689d6a"
white = "#a89984"

[colors.bright]
black = "#928374"
red = "#fb4934"
green = "#b8bb26"
yellow = "#fabd2f"
blue = "#83a598"
magenta = "#d3869b"
cyan = "#8ec07c"
white = "#ebdbb2"

[cursor]
style = { shape = "Block", blinking = "On" }  # Correct modern syntax

[selection]
save_to_clipboard = true
